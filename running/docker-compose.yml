services:
  app:
    build:
      context: .
    image: liferun-running-baby:latest
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://liferun:liferun_password@postgres:5432/liferun}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liferun}
      POSTGRES_USER: ${POSTGRES_USER:-liferun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liferun_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
