services:
  running-postgres-ci:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liferun_test
      POSTGRES_USER: liferun_test
      POSTGRES_PASSWORD: liferun_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferun_test -d liferun_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
