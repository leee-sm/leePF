image: node:22-bookworm

stages:
  - prepare
  - quality
  - docker
  - analyze
  - report
  - auto_fix

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  MAX_AUTO_FIX_ATTEMPTS: "2"
  RUN_E2E: "true"

cache:
  key:
    files:
      - running/package-lock.json
  paths:
    - .npm/
    - running/node_modules/

prepare:
  stage: prepare
  script:
    - cd running
    - npm ci --no-audit --no-fund
    - npx prisma validate
    - npx playwright install --with-deps chromium
  artifacts:
    expire_in: 1 week
    paths:
      - running/node_modules/
      - .cache/ms-playwright/

quality:
  stage: quality
  needs: [prepare]
  services:
    - name: postgres:16-alpine
      alias: running-postgres-ci
  variables:
    DATABASE_URL_TEST: "postgresql://liferun_test:liferun_test_password@running-postgres-ci:5432/liferun_test"
    DATABASE_URL: "postgresql://liferun_test:liferun_test_password@running-postgres-ci:5432/liferun_test"
  script:
    - export DATABASE_URL_TEST="$DATABASE_URL_TEST"
    - bash automation/scripts/run-quality.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/logs/
      - reports/

docker_build:
  stage: docker
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker network create leepf-ci
    - docker run -d --name leepf-postgres-ci --network leepf-ci -e POSTGRES_DB=liferun_test -e POSTGRES_USER=liferun_test -e POSTGRES_PASSWORD=liferun_test_password postgres:16-alpine
    - until docker exec leepf-postgres-ci pg_isready -U liferun_test -d liferun_test; do sleep 2; done
    - docker build --pull -t "leepf-running-ci:${CI_COMMIT_SHA}" running
    - docker run -d --name leepf-running-ci --network leepf-ci -e NODE_ENV=production -e DATABASE_URL=postgresql://liferun_test:liferun_test_password@leepf-postgres-ci:5432/liferun_test -e PORT=3000 -e HOST=0.0.0.0 "leepf-running-ci:${CI_COMMIT_SHA}"
    - until docker exec leepf-running-ci wget -qO- http://127.0.0.1:3000/api/health | grep -q '"status":"UP"'; do sleep 2; done
  after_script:
    - docker rm -f leepf-running-ci leepf-postgres-ci || true
    - docker network rm leepf-ci || true
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'

analyze:
  stage: analyze
  needs: [quality]
  script:
    - bash automation/scripts/analyze-failure.sh
  when: on_failure
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/failure-report.md
      - reports/failure-classification.txt

report:
  stage: report
  needs: [quality]
  script:
    - test -f reports/ci-summary.md
    - cat reports/ci-summary.md
  when: always
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - reports/
      - artifacts/logs/

auto_fix:
  stage: auto_fix
  needs: [quality, analyze]
  script:
    - bash automation/scripts/autofix.sh
  when: on_failure
  rules:
    - if: '$AUTO_FIX_ENABLED == "true" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
